parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Infrastructure\Messenger\Middleware\UnroutableMessageLoggerMiddleware:
        tags: [ 'messenger.middleware' ]

    App\:
        resource: '../src/'

    App\Infrastructure\Redis\RedisClientFactory:
        arguments:
            $host: '%env(REDIS_HOST)%'
            $port: '%env(int:REDIS_PORT)%'
            $password: '%env(REDIS_PASSWORD)%'
            $database: '%env(int:REDIS_DATABASE)%'

    App\Domain\Common\Cache\CacheClientInterface:
        class: App\Infrastructure\Redis\PhpRedisAdapter
        arguments:
            $redis: '@Redis'

    App\Infrastructure\Persistence\Pdo\DoctrinePdoProvider: ~

    PDO:
        class: PDO
        factory: ['@App\Infrastructure\Persistence\Pdo\DoctrinePdoProvider', 'getNativePdo']

    Redis:
        class: Redis
        factory: [ 'App\Infrastructure\Redis\RedisClientFactory', 'create' ]

    app.redis.client:
        alias: Redis
        public: false
